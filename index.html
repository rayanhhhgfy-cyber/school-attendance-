<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>منصة الحضور المدرسي الذكي - مدرسة الملك حسين بن طلال الثانوية للبنين</title>
    <meta name="description" content="منصة ذكية متطورة وسريعة لتسجيل الحضور المدرسي وإدارة الجداول وحالات الغياب والتقارير اليومية." />
    <meta property="og:title" content="Smart School Attendance Platform - منصة الحضور المدرسي الذكي" />
    <meta property="og:description" content="منصة ذكية متطورة وسريعة لتسجيل الحضور المدرسي وإدارة الجداول وحالات الغياب والتقارير اليومية." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="حضور مدرسي" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts: Cairo & Tajawal for superior Arabic legibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('attendance_system_v2_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-['Cairo',sans-serif] antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
